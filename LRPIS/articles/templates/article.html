<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="{{ STATIC_URL }}/static/article.css">
        <title>{{ post.title }}</title>
    </head>
    <body>
        <div class="small_logo">
            <img src="{{ STATIC_URL }}/static/logo.png" />
            <h2 class="link-to-main"><a href="/">Все статьи</a></h2>
        </div>
        <div class="one-post">
            <h1 class="post-title">{{ post.title }}</h1>
            <div class="article-info">
                <div class="article-author">{{ post.author.username }}</div>
                <div class="article-created-date">{{ post.created_date }}</div>
            </div>
            {% autoescape off %}
            <div class="article-text">{{ post.text }}</div>
            {% endautoescape %}
            </div>
    </body>
</html>
